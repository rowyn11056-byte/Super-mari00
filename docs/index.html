<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Super Mario Remix — Demo</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,Arial,Helvetica,sans-serif;background:#5c94fc;color:#081028}
    .wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px}
    canvas{width:360px;height:640px;image-rendering:pixelated;background:#78b0ff;border:6px solid #063046;border-radius:8px}
    .controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
    button.ctrl{width:50px;height:50px;border-radius:8px;background:#222;color:#fff;border:2px solid #000;font-size:18px}
    .hud{display:flex;gap:12px;align-items:center}
    .badge{background:#fff;padding:6px 10px;border-radius:6px;border:1px solid #e6e9ef}
    .note{max-width:720px;background:#fff;padding:12px;border-radius:8px;border:1px solid #e6e9ef}
    a.small{color:#063046;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Super Mario Remix — Demo</h1>
    <div class="hud"><div class="badge">Level: <span id="level">1</span></div><div class="badge">Score: <span id="score">0</span></div><div class="badge">Lives: <span id="lives">3</span></div></div>

    <canvas id="game" width="180" height="320"></canvas>

    <div class="controls">
      <button id="left" class="ctrl">←</button>
      <button id="right" class="ctrl">→</button>
      <button id="up" class="ctrl">↑</button>
      <button id="down" class="ctrl">↓</button>
      <button id="A" class="ctrl">A</button>
      <button id="B" class="ctrl">B</button>
    </div>

    <div class="note">
      <p>Controls: Arrow keys / Touch buttons to move. <strong>Z</strong> = A (jump), <strong>X</strong> = B.</p>
      <p>This is a small demo — touch or use keyboard to control the red player square, collect yellow coins, and reach the flag to advance levels.</p>
      <p><a class="small" href="https://github.com/rowyn11056-byte/Super-mari00">Repository on GitHub</a></p>
    </div>
  </div>

  <script>
  const c = document.getElementById('game'), x = c.getContext('2d'); x.imageSmoothingEnabled = false;

  // state
  let level = 1, score = 0, lives = 3, win = false;
  const p = {x:20,y:250,w:10,h:10,dx:0,dy:0,ground:false};
  const g = 0.45;
  let platforms = [], coins = [], enemies = [], flag = {x:500,y:260};
  const input = {L:false,R:false,U:false,D:false,A:false,B:false};

  function beep(){ /* keep silent in CI */ }

  function loadLevel(n){
    level = n; document.getElementById('level').textContent = level;
    win = false; p.x = 20; p.y = 250; p.dy = 0; p.dx = 0;
    coins = []; enemies = [];
    if(n===1){
      platforms = [{x:0,y:300,w:1400,h:20},{x:120,y:240,w:60,h:10}];
      coins = [{x:130,y:220,c:false}];
      enemies = [{x:300,y:290,w:10,h:10,d:1,min:280,max:360}];
      flag = {x:500,y:260};
    }
    if(n===2){
      platforms = [{x:0,y:300,w:1600,h:20},{x:200,y:220,w:80,h:10},{x:360,y:180,w:80,h:10}];
      coins = [{x:220,y:200,c:false},{x:380,y:160,c:false}];
      enemies = [{x:420,y:290,w:10,h:10,d:-1,min:400,max:520}];
      flag = {x:650,y:260};
    }
    if(n===3){
      platforms = [{x:0,y:300,w:1800,h:20},{x:300,y:200,w:100,h:10}];
      coins = [{x:320,y:180,c:false}];
      enemies = [{x:480,y:290,w:10,h:10,d:1,min:460,max:560}];
      flag = {x:800,y:260};
    }
    document.getElementById('score').textContent = score;
    document.getElementById('lives').textContent = lives;
  }

  // input
  ['left','right','up','down','A','B'].forEach(id=>{
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e=>{ e.preventDefault(); input[id==='A'? 'A' : id==='B'? 'B' : id.toUpperCase()] = true; });
    el.addEventListener('touchend', e=>{ e.preventDefault(); input[id==='A'? 'A' : id==='B'? 'B' : id.toUpperCase()] = false; });
    el.addEventListener('mousedown', e=>{ e.preventDefault(); input[id==='A'? 'A' : id==='B'? 'B' : id.toUpperCase()] = true; });
    el.addEventListener('mouseup', e=>{ e.preventDefault(); input[id==='A'? 'A' : id==='B'? 'B' : id.toUpperCase()] = false; });
  });

  window.addEventListener('keydown', e=>{
    if(e.code==='ArrowLeft') input.L = true;
    if(e.code==='ArrowRight') input.R = true;
    if(e.code==='ArrowUp') input.U = true;
    if(e.code==='ArrowDown') input.D = true;
    if(e.code==='KeyZ') input.A = true;
    if(e.code==='KeyX') input.B = true;
  });
  window.addEventListener('keyup', e=>{
    if(e.code==='ArrowLeft') input.L = false;
    if(e.code==='ArrowRight') input.R = false;
    if(e.code==='ArrowUp') input.U = false;
    if(e.code==='ArrowDown') input.D = false;
    if(e.code==='KeyZ') input.A = false;
    if(e.code==='KeyX') input.B = false;
  });

  function rectsOverlap(a,b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + (b.h||10) && a.y + a.h > b.y; }

  function update(){
    // horizontal
    if(input.L) p.dx = -2.2; else if(input.R) p.dx = 2.2; else p.dx *= 0.85;
    // jump
    if((input.U || input.A) && p.ground){ p.dy = -6.5; p.ground = false; }

    p.dy += g; p.x += p.dx; p.y += p.dy;

    // floor / platform collision
    p.ground = false;
    for(const pl of platforms){
      const nextY = p.y + p.h;
      if(p.x + p.w > pl.x && p.x < pl.x + pl.w){
        if(nextY >= pl.y && p.y + p.h - p.dy <= pl.y){
          p.y = pl.y - p.h; p.dy = 0; p.ground = true;
        }
      }
    }

    // bounds
    if(p.y > 400){ // fell
      lives--; document.getElementById('lives').textContent = lives;
      if(lives <= 0){ score = 0; lives = 3; document.getElementById('score').textContent = score; document.getElementById('lives').textContent = lives; }
      loadLevel(level);
    }

    // coins
    for(const coin of coins){
      if(!coin.c && rectsOverlap(p,{x:coin.x,y:coin.y,w:8,h:8})){ coin.c = true; score += 10; document.getElementById('score').textContent = score; }
    }

    // enemies
    for(const en of enemies){ en.x += en.d; if(en.x < en.min || en.x > en.max) en.d = -en.d; if(rectsOverlap(p,en)){ lives--; document.getElementById('lives').textContent = lives; loadLevel(level); return; } }

    // flag / finish
    if(p.x + p.w > flag.x){
      level++; if(level > 3){ win = true; setTimeout(()=>{ level = 1; loadLevel(level); }, 1200); } else { loadLevel(level); }
    }
  }

  function draw(){
    // simple camera
    const cam = Math.max(0, Math.min(1000, p.x - 60));
    x.clearRect(0,0,c.width,c.height);
    // background
    x.fillStyle = '#78b0ff'; x.fillRect(0,0,c.width,c.height);

    // draw platforms
    x.fillStyle = '#333';
    for(const pl of platforms){ x.fillRect((pl.x - cam)/2, pl.y/1.5, pl.w/2, pl.h/1.5); }

    // coins
    for(const coin of coins){ if(!coin.c){ x.fillStyle='#ffdd00'; x.fillRect((coin.x - cam)/2, coin.y/1.5, 6,6); } }

    // enemies
    for(const en of enemies){ x.fillStyle = '#aa0000'; x.fillRect((en.x - cam)/2, en.y/1.5, en.w, en.h); }

    // flag
    x.fillStyle = '#00aa00'; x.fillRect((flag.x - cam)/2, flag.y/1.5, 6,20);

    // player
    drawPlayer();
  }

  function drawPlayer(){ x.fillStyle='#ff0000'; x.fillRect((p.x - Math.max(0,p.x-60))/2, p.y/1.5, p.w, p.h); x.fillStyle='#0000ff'; x.fillRect((p.x - Math.max(0,p.x-60))/2+2, p.y/1.5+5,6,5); }

  // main loop
  function loop(){ update(); draw(); requestAnimationFrame(loop); }

  // init
  loadLevel(1); requestAnimationFrame(loop);
  </script>
</body>
</html>
